name: Folk Linux — Artifact'tan Release Yayınla

# Mevcut bir build artifact'ini indirmeden doğrudan GitHub Release'e kopyalar.
# Böylece kalıcı indirme linki oluşur, 4GB'ı yerel makineye çekmeye gerek kalmaz.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Artifact run ID (ör: 44198331431)'
        required: true
        default: '44198331431'
      artifact_name:
        description: 'Artifact adı'
        required: true
        default: 'folk-linux-iso-7'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Artifact'i indir (sunucu tarafında, hızlı)
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-files

      - name: İçeriği kontrol et
        run: |
          ls -lh release-files/
          ISO=$(find release-files -name '*.iso' -type f | head -n1)
          test -n "$ISO" || { echo "ISO bulunamadı!"; exit 1; }
          echo "ISO=$ISO" >> $GITHUB_ENV
          echo "Bulunan ISO: $ISO ($(du -h "$ISO" | cut -f1))"

      - name: Release oluştur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="rolling-$(date +%Y%m%d-%H%M)"
          ISO=$(find release-files -name '*.iso' -type f | head -n1)
          SHA=$(find release-files -name '*.sha512' -type f | head -n1)
          FILES="$ISO"
          [[ -n "$SHA" ]] && FILES="$FILES $SHA"
          gh release create "$TAG" $FILES \
            --repo "${{ github.repository }}" \
            --title "Folk Linux ISO — $(date +%Y.%m.%d)" \
            --notes "Folk Linux rolling ISO. Kalıcı indirme linki: bu sayfanın Assets bölümü.

          Kaynak run: #${{ inputs.run_id }}
          İndirmek için .iso dosyasına tıklayın." \
            --latest
          echo "✓ Release oluşturuldu: https://github.com/${{ github.repository }}/releases/latest"
