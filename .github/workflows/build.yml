name: Folk Linux ISO Build

# ISO DERLEMEK PARALI/ÜCRETLİ VE YAVAŞTIR (4 GB, ~8 dk).
# Bu yüzden YALNIZCA manuel tetiklenir. Her push'ta derleme YAPILMAZ.
# Günlük kontroller için "Folk Linux — Hızlı Doğrulama" workflow'u çalışır.
#
# ISO almak için: Actions > Folk Linux ISO Build > Run workflow
on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'ISO sürüm etiketi'
        required: false
        default: 'rolling'
      publish_release:
        description: 'GitHub Release olarak yayınla (kalıcı indirme linki)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  PROFILE: folklinux
  ISO_DIR: output

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Arch Linux kurulum ortamını hazırla (archiso container)
        run: |
          docker pull archlinux:base-devel
          echo "Arch container hazır."

      - name: ISO'yu archiso container içinde derle
        run: |
          docker run --privileged --rm \
            -v "$PWD":/work -w /work \
            archlinux:base-devel \
            bash /work/scripts/iso-build-inside-docker.sh

      - name: ISO adını doğrula
        id: iso
        run: |
          ISO_FILE=$(find output -name "*.iso" -type f | head -n1)
          if [[ -z "$ISO_FILE" ]]; then
            echo "::error::ISO dosyası üretilemedi. Build loglarını kontrol et."
            exit 1
          fi
          echo "file=$ISO_FILE" >> "$GITHUB_OUTPUT"
          echo "ISO: $ISO_FILE"
          ls -lh "$ISO_FILE"

      - name: ISO'yu artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: folk-linux-iso-${{ github.run_number }}
          path: |
            output/*.iso
            output/*.sha512
          retention-days: 30
          if-no-files-found: error

      - name: Özet rapor
        run: |
          echo "## Folk Linux ISO Build ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ISO:** $(basename "${{ steps.iso.outputs.file }}")" >> $GITHUB_STEP_SUMMARY
          echo "- **Boyut:** $(du -h "${{ steps.iso.outputs.file }}" | cut -f1)" >> $GITHUB_STEP_SUMMARY

      - name: GitHub Release olarak yayınla (kalıcı indirme linki)
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="rolling-$(date +%Y%m%d-%H%M)"
          ISO_FILE="${{ steps.iso.outputs.file }}"
          NOTES="Folk Linux rolling ISO — $(date +%Y-%m-%d)

          Commit: ${{ github.sha }}
          Boyut: $(du -h "$ISO_FILE" | cut -f1)

          İndirme: aşağıdaki Assets bölümünden .iso dosyasına tıkla."
          gh release create "$TAG" "$ISO_FILE" "$ISO_FILE.sha512" \
            --repo "${{ github.repository }}" \
            --title "Folk Linux ISO — $(date +%Y.%m.%d)" \
            --notes "$NOTES" \
            --latest
          echo "## Kalıcı indirme linki hazır" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/latest" >> $GITHUB_STEP_SUMMARY
