name: Folk Linux ISO Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      edition:
        description: 'ISO sürüm etiketi'
        required: false
        default: 'rolling'

env:
  PROFILE: folklinux
  ISO_DIR: output

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Arch Linux kurulum ortamını hazırla (archiso container)
        run: |
          docker pull archlinux:base-devel
          echo "Arch container hazır."

      - name: ISO'yu archiso container içinde derle
        run: |
          docker run --privileged --rm \
            -v "$PWD":/work -w /work \
            archlinux:base-devel \
            bash -lc '
              set -e
              pacman-key --init
              pacman -Syu --noconfirm --needed archiso dosfstools mtools syslinux

              # KURULU archiso sürümünün kendi releng profilini TEMEL AL.
              # Boot modları sürümler arasında değiştiği için profiledef.sh'ı
              # sıfırdan resmi dosyadan kopyalayıp SADECE skaler alanları sed ile
              # değiştiriyoruz. Böylece hiçbir parentez/dizi bozulmaz.
              PROFILE_DIR=archiso/folklinux
              RELENG=/usr/share/archiso/configs/releng
              if [[ -f "$RELENG/profiledef.sh" ]]; then
                cp "$RELENG/profiledef.sh" "$PROFILE_DIR/profiledef.sh"
                sed -i \
                  -e 's|^iso_name=.*|iso_name="folklinux"|' \
                  -e 's|^iso_label=.*|iso_label="FOLKLINUX_$(date +%Y%m)"|' \
                  -e 's|^iso_publisher=.*|iso_publisher="Folk Linux <https://github.com/yavuzyildizoglu5-create/folk-linux>"|' \
                  -e 's|^iso_application=.*|iso_application="Folk Linux Live/Install Media"|' \
                  -e 's|^install_dir=.*|install_dir="folk"|' \
                  "$PROFILE_DIR/profiledef.sh"

                # Resmi boot dosyalarını da kopyala (syslinux / efiboot)
                for d in syslinux efiboot; do
                  if [[ -d "$RELENG/$d" ]]; then
                    rm -rf "$PROFILE_DIR/$d"
                    cp -r "$RELENG/$d" "$PROFILE_DIR/$d"
                  fi
                done
                echo "✓ profiledef.sh + boot dosyaları kurulu archiso'nun releng profilinden alındı."
                grep -E '^(iso_name|install_dir|bootmodes)=' "$PROFILE_DIR/profiledef.sh"
              else
                echo "HATA: resmi releng profili bulunamadı: $RELENG" && exit 1
              fi

              # profiledef.sh sözdizimini derlemeden ÖNCE doğrula
              bash -n "$PROFILE_DIR/profiledef.sh" || { echo "HATA: profiledef.sh bozuk!"; exit 1; }

              cd archiso
              mkdir -p ../output ../work
              mkarchiso -v -w ../work -o ../output folklinux
            '

      - name: ISO adını doğrula
        id: iso
        run: |
          ISO_FILE=$(find output -name "*.iso" -type f | head -n1)
          if [[ -z "$ISO_FILE" ]]; then
            echo "::error::ISO dosyası üretilemedi. Build loglarını kontrol et."
            exit 1
          fi
          echo "file=$ISO_FILE" >> "$GITHUB_OUTPUT"
          echo "ISO: $ISO_FILE"
          ls -lh "$ISO_FILE"

      - name: SHA512 doğrulama dosyası oluştur
        run: |
          cd output
          sha512sum "$(basename "${{ steps.iso.outputs.file }}")" > "$(basename "${{ steps.iso.outputs.file }}").sha512"
          cat *.sha512

      - name: ISO'yu artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: folk-linux-iso-${{ github.run_number }}
          path: |
            output/*.iso
            output/*.sha512
          retention-days: 30
          if-no-files-found: error

      - name: Özet rapor
        run: |
          echo "## Folk Linux ISO Build ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ISO:** $(basename "${{ steps.iso.outputs.file }}")" >> $GITHUB_STEP_SUMMARY
          echo "- **Boyut:** $(du -h "${{ steps.iso.outputs.file }}" | cut -f1)" >> $GITHUB_STEP_SUMMARY
