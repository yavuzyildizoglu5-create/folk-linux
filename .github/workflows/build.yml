name: Folk Linux ISO Build

# ISO derlemesi ~8 dk sürer, bu yüzden YALNIZCA manuel tetiklenir.
# Her push'ta sadece hızlı doğrulama çalışır (validate.yml, 10 sn).
# ISO < 2 GB olduğu için GitHub Release olarak yayınlanır → KALICI İNDİRME LİNKİ.
#
# ISO almak için: Actions > Folk Linux ISO Build > Run workflow
# Sonra: https://github.com/yavuzyildizoglu5-create/folk-linux/releases/latest
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PROFILE: folklinux
  ISO_DIR: output

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Arch Linux kurulum ortamını hazırla (archiso container)
        run: |
          docker pull archlinux:base-devel
          echo "Arch container hazır."

      - name: ISO'yu archiso container içinde derle
        run: |
          docker run --privileged --rm \
            -v "$PWD":/work -w /work \
            archlinux:base-devel \
            bash /work/scripts/iso-build-inside-docker.sh

      - name: ISO adını doğrula
        id: iso
        run: |
          ISO_FILE=$(find output -name "*.iso" -type f | head -n1)
          if [[ -z "$ISO_FILE" ]]; then
            echo "::error::ISO dosyası üretilemedi. Build loglarını kontrol et."
            exit 1
          fi
          echo "file=$ISO_FILE" >> "$GITHUB_OUTPUT"
          echo "ISO: $ISO_FILE"
          ls -lh "$ISO_FILE"

      - name: ISO'yu artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: folk-linux-iso-${{ github.run_number }}
          path: |
            output/*.iso
            output/*.sha512
          retention-days: 30
          if-no-files-found: error

      - name: Özet rapor
        run: |
          echo "## Folk Linux ISO Build ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ISO:** $(basename "${{ steps.iso.outputs.file }}")" >> $GITHUB_STEP_SUMMARY
          echo "- **Boyut:** $(du -h "${{ steps.iso.outputs.file }}" | cut -f1)" >> $GITHUB_STEP_SUMMARY

      - name: GitHub Release yayınla (kalıcı indirme linki)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="rolling-$(date +%Y%m%d-%H%M)"
          ISO="${{ steps.iso.outputs.file }}"
          SHA="$ISO.sha512"
          SIZE=$(stat -c %s "$ISO")
          echo "ISO boyutu: $SIZE bayt"
          if (( SIZE > 2000000000 )); then
            echo "::warning::ISO 2 GB limitini aştı, Release'e konamıyor. Artifact olarak kaldı."
            exit 0
          fi
          gh release create "$TAG" "$ISO" "$SHA" \
            --repo "${{ github.repository }}" \
            --title "Folk Linux ISO — $(date +%Y.%m.%d)" \
            --notes "Folk Linux rolling ISO. .iso dosyasına tıklayarak indirin.

          Commit: ${{ github.sha }} | Boyut: $(du -h "$ISO" | cut -f1)" \
            --latest
          echo "## ✓ Kalıcı indirme linki" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/latest" >> $GITHUB_STEP_SUMMARY
