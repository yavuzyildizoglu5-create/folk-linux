# /etc/mkinitcpio.conf — Folk Linux
# Live ISO ve kurulu sistem için ortak initramfs yapılandırması

MODULES=(btrfs xfs)

BINARIES=(/usr/bin/btrfs)

FILES=(
    /etc/vconsole.conf
)

HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block filesystems fsck)

# Kompresim (hız / boyut dengesi)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0 -15)

MODULES_DECOMPRESS="yes"
