# /etc/sddm.conf.d/10-folklinux.conf — Folk Linux SDDM yapılandırması

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
NumLock=on

[Theme]
ThemeDir=/usr/share/sddm/themes/breeze
Current=breeze

[Users]
MaximumUid=60000
MinimumUid=1000
HideShells=/usr/bin/false,/usr/sbin/nologin
RememberLastUser=true
RememberLastSession=false

[Session]
SessionDir=/usr/share/xsessions
StateDir=/run/sddm

[X11]
ServerArguments=-nolisten tcp
