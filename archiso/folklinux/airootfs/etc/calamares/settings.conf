# Calamares ayarları — Folk Linux
# Kaynak: https://github.com/calamares/calamares/wiki/Deploy-Settings

modules-search: [ local ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - sources
      - locale
      - keyboard
      - fstab
      - locale
      - users
      - rootpasswd
      - hostinfo
      - network
      - packages
      - kernel
      - bootloader
      - umount
  - done:
      - finished

branding: folklinux

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
