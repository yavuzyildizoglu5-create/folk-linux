# /etc/pacman.conf — Folk Linux
# Arch Linux resmi depoları

[options]
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
Architecture = x86_64
Color
TotalDownload
CheckSpace
VerbosePkgLists
ParallelDownloads = 5

# ── Resmi depolar ───────────────────────────────────────────────
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
