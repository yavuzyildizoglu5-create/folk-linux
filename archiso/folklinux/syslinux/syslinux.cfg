# Folk Linux — SYSLINUX bootloader (BIOS)
# archiso %INSTALL_DIR% ve %ARCHISO_LABEL% değişkenlerini otomatik değiştirir.

DEFAULT folk
PROMPT 0
TIMEOUT 150
TOTALTIMEOUT 9000

MENU TITLE Folk Linux — Boot Menu

LABEL folk
MENU LABEL Folk Linux (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%

LABEL folk-nonfree
MENU LABEL Folk Linux (x86_64, BIOS) — NVIDIA
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nvidia_drm.modeset=1

LABEL memtest
MENU LABEL Memory test (Memtest86+)
LINUX /%INSTALL_DIR%/boot/memtest

LABEL reboot
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power off
COM32 poweroff.c32
